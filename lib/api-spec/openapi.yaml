      type: object
      properties:
        linha:
          type: integer
        motivo:
          type: string
      required:
        - linha
        - motivo
    ImportValidationSummary:
      type: object
      properties:
        storage_path:
          type: string
        total_linhas:
          type: integer
        validos:
          type: integer
        invalidos:
          type: integer
        novos:
          type: integer
        atualizados:
          type: integer
        duplicados_no_arquivo:
          type: integer
        duplicados_email:
          type: integer
        duplicados_telefone:
          type: integer
        suprimidos:
          type: integer
        total_na_lista:
          type: integer
          minimum: 0
          description: Total atual de destinatários na lista da campanha após a importação.
        suprimidos_no_envio:
          type: integer
          minimum: 0
          description: Destinatários da lista atualmente presentes na tabela de supressão.
        receberao_de_fato:
          type: integer
          minimum: 0
