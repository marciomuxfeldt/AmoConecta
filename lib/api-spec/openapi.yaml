          type: integer
          minimum: 0
        total_linhas:
          type: ["integer", "null"]
          minimum: 0
        resultado:
          anyOf:
            - $ref: "#/components/schemas/ImportValidationSummary"
            - type: "null"
        erro:
          type: ["string", "null"]
        criado_em:
          type: string
          format: date-time
