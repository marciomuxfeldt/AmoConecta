openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API do AmoConecta
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sessão da equipe de marketing
  - name: campaigns
    description: Campanhas de e-mail
  - name: safety
    description: Estado seguro da operação de envios
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /safety-mode:
    get:
      operationId: getSafetyMode
      tags: [safety]
      summary: Retorna o estado seguro da operação de envios
      description: Não expõe os endereços configurados na allowlist.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Estado do modo de segurança
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyMode"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaign-defaults:
    get:
      operationId: getCampaignDefaults
      tags: [campaigns]
      summary: Retorna os padrões seguros para novas campanhas
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Padrões da campanha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDefaults"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Configuração de remetente ausente ou inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Retorna a sessão atual
      responses:
        "200":
          description: Sessão atual ou ausência de sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Autentica o usuário do marketing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sessão autenticada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerra a sessão atual
      responses:
        "204":
          description: Sessão encerrada
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: Lista campanhas da conta autenticada
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Lista de campanhas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignListItem"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Cria uma campanha
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignInput"
      responses:
        "201":
          description: Campanha criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Consulta uma campanha
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Campanha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao consultar o Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Atualiza uma campanha
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignInput"
      responses:
        "200":
          description: Campanha atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Exclui uma campanha
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Campanha excluída
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao excluir no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/agendar:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: scheduleCampaign
      tags: [campaigns]
      summary: Agenda uma campanha após validar o envio
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCampaignInput"
      responses:
        "200":
          description: Campanha agendada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transição não permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Dados inválidos ou confirmação incorreta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/pausar:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: pauseCampaign
      tags: [campaigns]
      summary: Pausa uma campanha em envio
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Campanha pausada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transição não permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/retomar:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resumeCampaign
      tags: [campaigns]
      summary: Retoma uma campanha pausada
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Campanha retomada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transição não permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Campanha bloqueada pelo modo de segurança
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/cancelar:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelCampaign
      tags: [campaigns]
      summary: Cancela uma campanha operacional
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Campanha cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transição não permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/test:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendCampaignTest
      tags: [campaigns]
      summary: Envia um teste para o e-mail da sessão
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Teste enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendTestResponse"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Teste bloqueado ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/recipients/summary:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCampaignRecipientSummary
      tags: [campaigns]
      summary: Consulta o resumo de destinatários de uma campanha
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Resumo de destinatários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRecipientSummary"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao consultar os destinatários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/recipients:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: clearCampaignRecipients
      tags: [campaigns]
      summary: Limpa os destinatários de uma campanha
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Destinatários removidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRecipientsCleared"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Campanha em operação e não pode ser limpa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao limpar os destinatários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/assets/upload-url:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestCampaignAssetUploadUrl
      tags: [campaigns]
      summary: Gera URL assinada para upload de imagem do e-mail
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEmailImageUploadInput"
      responses:
        "200":
          description: URL assinada e URL pública da imagem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailImageUploadUrl"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Imagem inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao preparar o upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/imports/upload-url:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestCampaignImportUploadUrl
      tags: [campaigns]
      summary: Gera URL assinada para upload do CSV
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestImportUploadInput"
      responses:
        "200":
          description: URL assinada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportUploadUrl"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao criar URL de upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/imports/validate:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: validateCampaignImport
      tags: [campaigns]
      summary: Valida e importa um CSV de destinatários
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateImportInput"
      responses:
        "202":
          description: Validação registrada para processamento assíncrono
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportValidationJob"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Arquivo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao validar ou importar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/imports/{importId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: importId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCampaignImport
      tags: [campaigns]
      summary: Consulta o progresso de uma validação
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Estado e progresso da validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportValidationJob"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Importação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao consultar o Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: amoconecta_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SafetyMode:
      type: object
      properties:
        envio_liberado:
          type: boolean
        allowlist_count:
          type: integer
          minimum: 0
        message:
          type: ["string", "null"]
      required:
        - envio_liberado
        - allowlist_count
        - message
    CampaignDefaults:
      type: object
      properties:
        remetente_email:
          type: string
          format: email
        remetente_nome:
          type: string
        reply_to:
          type: string
          format: email
        teto_hora:
          type: integer
          minimum: 0
        teto_dia:
          type: integer
          minimum: 0
      required:
        - remetente_email
        - remetente_nome
        - reply_to
        - teto_hora
        - teto_dia
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
      required:
        - id
        - email
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - authenticated
        - user
    CampaignListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        status:
          type: string
          enum: [rascunho, agendada, enviando, pausada, concluida]
        enviados:
          type: integer
        entregues:
          type: integer
        abertos:
          type: integer
        clicados:
          type: integer
        destinatarios_total:
          type: integer
          minimum: 0
        agendada_para:
          type: ["string", "null"]
          format: date-time
        criado_em:
          type: string
          format: date-time
      required:
        - id
        - nome
        - status
        - enviados
        - entregues
        - abertos
        - clicados
        - destinatarios_total
        - agendada_para
        - criado_em
    RecipientStatusSummary:
      type: object
      properties:
        pendente:
          type: integer
          minimum: 0
        enviado:
          type: integer
          minimum: 0
        entregue:
          type: integer
          minimum: 0
        bloqueado:
          type: integer
          minimum: 0
        suprimido:
          type: integer
          minimum: 0
        erro:
          type: integer
          minimum: 0
      required: [pendente, enviado, entregue, bloqueado, suprimido, erro]
    RecipientReputationMetric:
      type: object
      properties:
        quantidade:
          type: integer
          minimum: 0
        percentual:
          type: number
          minimum: 0
          description: Percentual real sobre o total enviado, de 0 a 100.
        limite_percentual:
          type: number
          minimum: 0
      required: [quantidade, percentual, limite_percentual]
    RecipientReputationSummary:
      type: object
      properties:
        total_enviado:
          type: integer
          minimum: 0
        bounce:
          $ref: "#/components/schemas/RecipientReputationMetric"
        reclamacao:
          $ref: "#/components/schemas/RecipientReputationMetric"
      required: [total_enviado, bounce, reclamacao]
    RecipientRecencyBucket:
      type: object
      properties:
        faixa:
          type: string
        quantidade:
          type: integer
          minimum: 0
      required: [faixa, quantidade]
    CampaignRecipientSummary:
      type: object
      properties:
        campanha_id:
          type: string
          format: uuid
        total:
          type: integer
          minimum: 0
        total_na_lista:
          type: integer
          minimum: 0
          description: Total atual de destinatários na lista principal.
        suprimidos_no_envio:
          type: integer
          minimum: 0
          description: Destinatários atualmente presentes na tabela de supressão.
        receberao_de_fato:
          type: integer
          minimum: 0
          description: Total atual da lista menos as supressões atuais.
        status:
          $ref: "#/components/schemas/RecipientStatusSummary"
        reputacao:
          $ref: "#/components/schemas/RecipientReputationSummary"
        recencia:
          type: array
          items:
            $ref: "#/components/schemas/RecipientRecencyBucket"
      required: [campanha_id, total, total_na_lista, suprimidos_no_envio, receberao_de_fato, status, reputacao, recencia]
    CampaignRecipientsCleared:
      type: object
      properties:
        campanha_id:
          type: string
          format: uuid
