openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API do AmoConecta
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: webhooks
    description: Eventos autenticados de provedores externos
  - name: auth
    description: Sessão da equipe de marketing
  - name: team
    description: Convites e acessos da equipe
  - name: campaigns
    description: Campanhas de e-mail
  - name: safety
    description: Estado seguro da operação de envios
  - name: settings
    description: Identidade visual global dos e-mails
  - name: engagement
    description: Engajamento e exportação para BI
paths:
  /webhooks/resend:
    post:
      operationId: receiveResendWebhook
      tags: [webhooks]
      summary: Registra um evento assinado do Resend
      description: A assinatura Svix é verificada sobre os bytes JSON originais antes da interpretação do payload.
      parameters:
        - name: svix-id
          in: header
          required: true
          schema:
            type: string
        - name: svix-timestamp
          in: header
          required: true
          schema:
            type: string
        - name: svix-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendWebhookEvent"
      responses:
        "200":
          description: Evento salvo para processamento idempotente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcknowledgement"
        "400":
          description: Corpo ou evento assinado malformado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Assinatura Svix inválida ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Payload maior que o limite aceito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha ao persistir o evento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Segredo de verificação não configurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /safety-mode:
    get:
      operationId: getSafetyMode
      tags: [safety]
      summary: Retorna o estado seguro da operação de envios
      description: Não expõe os endereços configurados na allowlist.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Estado do modo de segurança
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyMode"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaign-defaults:
    get:
      operationId: getCampaignDefaults
      tags: [campaigns]
      summary: Retorna os padrões seguros para novas campanhas
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Padrões da campanha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDefaults"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Configuração de remetente ausente ou inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /email-branding:
    get:
      operationId: getEmailBranding
      tags: [settings]
      summary: Retorna a identidade visual dos e-mails
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Configuração global atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailBranding"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateEmailBranding
      tags: [settings]
      summary: Atualiza a cor global dos botões de e-mail
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailBrandingUpdate"
      responses:
        "200":
          description: Configuração atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailBranding"
        "400":
          description: Cor inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /engagement/summary:
    get:
      operationId: getEngagementSummary
      tags: [engagement]
      summary: Retorna a quantidade atual de contatos desengajados
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Resumo de engajamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementSummary"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bi-exports:
    get:
      operationId: listBiExports
      tags: [engagement]
      summary: Lista exportações BI recentes
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Exportações recentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiExportJobsResponse"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createBiExport
      tags: [engagement]
      summary: Solicita uma exportação BI assíncrona
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiExportRequest"
      responses:
        "202":
          description: Exportação enfileirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiExportJob"
        "400":
          description: Filtros inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bi-exports/{exportId}:
    get:
      operationId: getBiExport
      tags: [engagement]
      summary: Consulta o andamento de uma exportação
      security:
        - sessionCookie: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado da exportação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiExportJob"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Exportação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bi-exports/{exportId}/download:
    get:
      operationId: downloadBiExport
      tags: [engagement]
      summary: Baixa o arquivo CSV gerado
      security:
        - sessionCookie: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Arquivo CSV
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Arquivo inexistente ou expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Retorna a sessão atual
      responses:
        "200":
          description: Sessão atual ou ausência de sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Autentica o usuário do marketing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sessão autenticada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerra a sessão atual
      responses:
        "204":
          description: Sessão encerrada
  /auth/invitations/accept:
    post:
      operationId: acceptTeamInvitation
      tags: [auth]
      summary: Ativa uma conta a partir de um convite válido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTeamInvitationInput"
      responses:
        "200":
          description: Conta ativada e sessão iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Convite inválido, expirado ou já utilizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: E-mail já associado a outra conta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/password-recovery:
    post:
      operationId: requestPasswordRecovery
      tags: [auth]
      summary: Solicita link de recuperação de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryInput"
      responses:
        "202":
          description: Resposta neutra para evitar enumeração de contas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/password-recovery/complete:
    post:
      operationId: completePasswordRecovery
      tags: [auth]
      summary: Define uma nova senha com um token de uso único
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordRecoveryInput"
      responses:
        "200":
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token inválido, expirado ou já utilizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /team:
    get:
      operationId: getTeamAccess
      tags: [team]
      summary: Lista membros e convites pendentes
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Acessos da equipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamAccessResponse"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /team/invites:
    post:
      operationId: createTeamInvitation
      tags: [team]
      summary: Envia um convite de acesso
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInvitationInput"
      responses:
        "201":
          description: Convite enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
        "400":
          description: E-mail fora do domínio permitido ou já cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /team/invites/{inviteId}/resend:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resendTeamInvitation
      tags: [team]
      summary: Reenvia o convite e renova seu prazo
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Convite reenviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Convite pendente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /team/invites/{inviteId}/cancel:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelTeamInvitation
      tags: [team]
      summary: Cancela um convite pendente
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Convite cancelado
        "404":
          description: Convite pendente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /team/users/{userId}/deactivate:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: deactivateTeamMember
      tags: [team]
      summary: Desativa um membro sem apagar o histórico
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Membro desativado e sessões revogadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Não é permitido desativar a própria conta ou o último membro ativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/audit:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCampaignAudit
      tags: [campaigns]
      summary: Lista o histórico de ações da campanha
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Histórico da campanha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignAuditResponse"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: Lista campanhas da conta autenticada
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Lista de campanhas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignListItem"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Cria uma campanha
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignInput"
      responses:
        "201":
          description: Campanha criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/drafts:
    post:
      operationId: createCampaignDraft
      tags: [campaigns]
      summary: Inicia um rascunho de campanha para edição e uploads
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignDraftInput"
      responses:
        "201":
          description: Rascunho criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Configuração do remetente inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao criar o rascunho
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedError"
  /campaigns/{campaignId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Consulta uma campanha
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Campanha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao consultar o Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Atualiza uma campanha
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignInput"
      responses:
        "200":
          description: Campanha atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Exclui uma campanha
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Campanha excluída
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao excluir no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/agendar:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: scheduleCampaign
      tags: [campaigns]
      summary: Agenda uma campanha após validar o envio
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCampaignInput"
      responses:
        "200":
          description: Campanha agendada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transição não permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Dados inválidos ou confirmação incorreta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/pausar:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: pauseCampaign
      tags: [campaigns]
      summary: Pausa uma campanha em envio
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Campanha pausada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transição não permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/retomar:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resumeCampaign
      tags: [campaigns]
      summary: Retoma uma campanha pausada
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignResumeInput"
      responses:
        "200":
          description: Campanha retomada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transição não permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Campanha sem teste confirmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/cancelar:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelCampaign
      tags: [campaigns]
      summary: Cancela uma campanha operacional
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Campanha cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transição não permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao salvar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/test:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendCampaignTest
      tags: [campaigns]
      summary: Envia um teste para o e-mail da sessão
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Teste enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendTestResponse"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Teste bloqueado ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/recipients/summary:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCampaignRecipientSummary
      tags: [campaigns]
      summary: Consulta o resumo de destinatários de uma campanha
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Resumo de destinatários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRecipientSummary"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao consultar os destinatários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/recipients:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: clearCampaignRecipients
      tags: [campaigns]
      summary: Limpa os destinatários de uma campanha
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Destinatários removidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRecipientsCleared"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Campanha em operação e não pode ser limpa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao limpar os destinatários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/assets/upload-url:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestCampaignAssetUploadUrl
      tags: [campaigns]
      summary: Gera URL assinada para upload de imagem do e-mail
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEmailImageUploadInput"
      responses:
        "200":
          description: URL assinada e URL pública da imagem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailImageUploadUrl"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Imagem inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao preparar o upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedError"
  /campaigns/{campaignId}/imports/upload-url:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestCampaignImportUploadUrl
      tags: [campaigns]
      summary: Gera URL assinada para upload do CSV
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestImportUploadInput"
      responses:
        "200":
          description: URL assinada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportUploadUrl"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao criar URL de upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedError"
  /campaigns/{campaignId}/imports/validate:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: validateCampaignImport
      tags: [campaigns]
      summary: Valida e importa um CSV de destinatários
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateImportInput"
      responses:
        "202":
          description: Validação registrada para processamento assíncrono
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportValidationJob"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Campanha não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Arquivo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao validar ou importar no Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /campaigns/{campaignId}/imports/{importId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: importId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCampaignImport
      tags: [campaigns]
      summary: Consulta o progresso de uma validação
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Estado e progresso da validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportValidationJob"
        "401":
          description: Usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Importação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Falha ao consultar o Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: amoconecta_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SafetyMode:
      type: object
      properties:
        envio_liberado:
          type: boolean
        allowlist_count:
          type: integer
          minimum: 0
        message:
          type: ["string", "null"]
      required:
        - envio_liberado
        - allowlist_count
        - message
    CampaignDefaults:
      type: object
      properties:
        remetente_email:
          type: string
          format: email
        remetente_nome:
          type: string
        reply_to:
          type: ["string", "null"]
          format: email
        teto_hora:
          type: integer
          minimum: 0
        teto_dia:
          type: integer
          minimum: 0
        cor_botao_email:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        desengajados_total:
          type: integer
          minimum: 0
      required:
        - remetente_email
        - remetente_nome
        - reply_to
        - teto_hora
        - teto_dia
        - cor_botao_email
        - desengajados_total
    EmailBranding:
      type: object
      properties:
        cor_botao_email:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        atualizado_em:
          type: string
          format: date-time
      required: [cor_botao_email, atualizado_em]
    EmailBrandingUpdate:
      type: object
      properties:
        cor_botao_email:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
      required: [cor_botao_email]
    EngagementSummary:
      type: object
      properties:
        desengajados_total:
          type: integer
          minimum: 0
        calculado_em:
          type: ["string", "null"]
          format: date-time
      required: [desengajados_total, calculado_em]
    BiExportFilter:
      type: string
      enum: [todos, clicaram, abriram_sem_clicar, nao_abriram, bounce_ou_reclamacao]
    BiExportRequest:
      type: object
      properties:
        campanha_id:
          type: ["string", "null"]
          format: uuid
        periodo_inicio:
          type: ["string", "null"]
          format: date
        periodo_fim:
          type: ["string", "null"]
          format: date
        filtro:
          $ref: "#/components/schemas/BiExportFilter"
      required: [campanha_id, periodo_inicio, periodo_fim, filtro]
    BiExportJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campanha_id:
          type: ["string", "null"]
          format: uuid
        filtro:
          $ref: "#/components/schemas/BiExportFilter"
        periodo_inicio:
          type: ["string", "null"]
          format: date
        periodo_fim:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [pendente, processando, concluida, erro, expirada]
        total_linhas:
          type: ["integer", "null"]
          minimum: 0
        linhas_processadas:
          type: integer
          minimum: 0
        criado_em:
          type: string
          format: date-time
        concluido_em:
          type: ["string", "null"]
          format: date-time
        expira_em:
          type: ["string", "null"]
          format: date-time
        erro:
          type: ["string", "null"]
        disponivel_para_download:
          type: boolean
      required:
        - id
        - campanha_id
        - filtro
        - periodo_inicio
        - periodo_fim
        - status
        - total_linhas
        - linhas_processadas
        - criado_em
        - concluido_em
        - expira_em
        - erro
        - disponivel_para_download
    BiExportJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/BiExportJob"
      required: [jobs]
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DetailedError:
      type: object
      properties:
        error:
          type: string
        request_id:
          type: string
        technical_error:
          $ref: "#/components/schemas/TechnicalError"
      required:
        - error
        - request_id
        - technical_error
    TechnicalError:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        code:
          type: ["string", "null"]
        details:
          type: ["string", "null"]
        hint:
          type: ["string", "null"]
        cause:
          type: ["string", "null"]
      required:
        - name
        - message
        - code
        - details
        - hint
        - cause
    CampaignDraftInput:
      type: object
      additionalProperties: false
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
      required:
        - id
        - email
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - authenticated
        - user
    CampaignListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        status:
          type: string
          enum: [rascunho, agendada, enviando, pausada, concluida]
        enviados:
          type: integer
        entregues:
          type: integer
        abertos:
          type: integer
        clicados:
          type: integer
        destinatarios_total:
          type: integer
          minimum: 0
        agendada_para:
          type: ["string", "null"]
          format: date-time
        criado_em:
          type: string
          format: date-time
        criado_por_nome:
          type: ["string", "null"]
        criado_por_email:
          type: ["string", "null"]
      required:
        - id
        - nome
        - status
        - enviados
        - entregues
        - abertos
        - clicados
        - destinatarios_total
        - agendada_para
        - criado_em
        - criado_por_nome
        - criado_por_email
    RecipientStatusSummary:
      type: object
      properties:
        pendente:
          type: integer
          minimum: 0
        enviado:
          type: integer
          minimum: 0
        entregue:
          type: integer
          minimum: 0
        bloqueado:
          type: integer
          minimum: 0
        suprimido:
          type: integer
          minimum: 0
        erro:
          type: integer
          minimum: 0
      required: [pendente, enviado, entregue, bloqueado, suprimido, erro]
    RecipientReputationMetric:
      type: object
      properties:
        quantidade:
          type: integer
          minimum: 0
        percentual:
          type: number
          minimum: 0
          description: Percentual da quantidade sobre a base específica da métrica, de 0 a 100.
        limite_percentual:
          type: number
          minimum: 0
      required: [quantidade, percentual, limite_percentual]
    RecipientReputationSummary:
      type: object
      properties:
        total_enviado:
          type: integer
          minimum: 0
        total_entregue:
          type: integer
          minimum: 0
        bounce:
          $ref: "#/components/schemas/RecipientReputationMetric"
        reclamacao:
          $ref: "#/components/schemas/RecipientReputationMetric"
      required: [total_enviado, total_entregue, bounce, reclamacao]
    RecipientEmailMetric:
      type: object
      properties:
        quantidade:
          type: integer
          minimum: 0
        percentual:
          type: number
          minimum: 0
          description: Percentual sobre a base de referência da métrica, de 0 a 100.
      required: [quantidade, percentual]
    CampaignEmailMetrics:
      type: object
      properties:
        enviados:
          $ref: "#/components/schemas/RecipientEmailMetric"
        entregues:
          $ref: "#/components/schemas/RecipientEmailMetric"
        aberturas:
          $ref: "#/components/schemas/RecipientEmailMetric"
        cliques:
          $ref: "#/components/schemas/RecipientEmailMetric"
        bounces:
          $ref: "#/components/schemas/RecipientEmailMetric"
        bounces_permanentes:
          $ref: "#/components/schemas/RecipientEmailMetric"
        bounces_temporarios:
          $ref: "#/components/schemas/RecipientEmailMetric"
        bounces_indeterminados:
          $ref: "#/components/schemas/RecipientEmailMetric"
        reclamacoes:
          $ref: "#/components/schemas/RecipientEmailMetric"
        descadastros:
          $ref: "#/components/schemas/RecipientEmailMetric"
      required: [enviados, entregues, aberturas, cliques, bounces, bounces_permanentes, bounces_temporarios, bounces_indeterminados, reclamacoes, descadastros]
    RecipientRecencyBucket:
      type: object
      properties:
        faixa:
          type: string
        quantidade:
          type: integer
          minimum: 0
      required: [faixa, quantidade]
    CampaignRecipientSummary:
      type: object
      properties:
        campanha_id:
          type: string
          format: uuid
        total:
          type: integer
          minimum: 0
        total_na_lista:
          type: integer
          minimum: 0
          description: Total atual de destinatários na lista principal.
        suprimidos_no_envio:
          type: integer
          minimum: 0
          description: Destinatários atualmente presentes na tabela de supressão.
        permitidos_modo_teste:
          type: integer
          minimum: 0
          description: Destinatários não suprimidos que podem receber no modo de segurança.
        bloqueados_modo_teste:
          type: integer
          minimum: 0
          description: Destinatários não suprimidos que serão bloqueados pelo modo de segurança.
        receberao_de_fato:
          type: integer
          minimum: 0
          description: Total atual da lista menos as supressões atuais.
        status:
          $ref: "#/components/schemas/RecipientStatusSummary"
        reputacao:
          $ref: "#/components/schemas/RecipientReputationSummary"
        metricas_email:
          $ref: "#/components/schemas/CampaignEmailMetrics"
        status_lembrete:
          $ref: "#/components/schemas/RecipientStatusSummary"
        metricas_email_lembrete:
          $ref: "#/components/schemas/CampaignEmailMetrics"
        desengajados_total:
          type: integer
          minimum: 0
        desengajados_na_lista:
          type: integer
          minimum: 0
        bloqueados_desengajados:
          type: integer
          minimum: 0
        recencia:
          type: array
          items:
            $ref: "#/components/schemas/RecipientRecencyBucket"
      required: [campanha_id, total, total_na_lista, suprimidos_no_envio, permitidos_modo_teste, bloqueados_modo_teste, receberao_de_fato, status, reputacao, metricas_email, status_lembrete, metricas_email_lembrete, desengajados_total, desengajados_na_lista, bloqueados_desengajados, recencia]
    CampaignRecipientsCleared:
      type: object
      properties:
        campanha_id:
          type: string
          format: uuid
        destinatarios_removidos:
          type: integer
          minimum: 0
      required: [campanha_id, destinatarios_removidos]
    CampaignStatus:
      type: string
      enum: [rascunho, agendada, enviando, pausada, concluida, cancelada]
    ScheduleCampaignInput:
      type: object
      properties:
        confirmacao_destinatarios:
          type: ["string", "null"]
          pattern: "^[0-9]*$"
          maxLength: 20
    CampaignResumeInput:
      type: object
      properties:
        confirmar_reputacao:
          type: boolean
          description: Confirma explicitamente a retomada após uma pausa automática por reputação.
      required: [confirmar_reputacao]
    ResendWebhookEvent:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
      required: [type, created_at, data]
    WebhookAcknowledgement:
      type: object
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
      required: [received]
    SendTestResponse:
      type: object
      properties:
        sent:
          type: boolean
        resend_email_id:
          type: string
      required: [sent, resend_email_id]
    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        assunto:
          type: string
        preheader:
          type: ["string", "null"]
          maxLength: 100
        assunto_lembrete:
          type: ["string", "null"]
        corpo_lembrete:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/EmailBlock"
        cor_botao_snapshot:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        incluir_desengajados:
          type: boolean
        remetente_nome:
          type: string
        remetente_email:
          type: string
          format: email
        reply_to:
          type: ["string", "null"]
          format: email
        valor_credito:
          type: ["number", "null"]
        validade_credito:
          type: ["string", "null"]
          format: date
        teto_hora:
          type: ["integer", "null"]
          minimum: 0
        teto_dia:
          type: ["integer", "null"]
          minimum: 0
        pausa_motivo:
          type: ["string", "null"]
        pausa_taxa_bounce:
          type: ["number", "null"]
        pausa_taxa_reclamacao:
          type: ["number", "null"]
        pausada_em:
          type: ["string", "null"]
          format: date-time
        enviados_hora:
          type: integer
          minimum: 0
        enviados_dia:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/CampaignStatus"
        agendada_para:
          type: ["string", "null"]
          format: date-time
        lembrete_horas:
          type: integer
          minimum: 24
          maximum: 168
        teste_enviado:
          type: boolean
        teste_enviado_em:
          type: ["string", "null"]
          format: date-time
        corpo:
          type: array
          items:
            $ref: "#/components/schemas/EmailBlock"
        criado_em:
          type: string
          format: date-time
        criado_por_nome:
          type: ["string", "null"]
        criado_por_email:
          type: ["string", "null"]
        agendado_por_nome:
          type: ["string", "null"]
        agendado_por_email:
          type: ["string", "null"]
        agendado_em:
          type: ["string", "null"]
          format: date-time
        pausado_por_nome:
          type: ["string", "null"]
        pausado_por_email:
          type: ["string", "null"]
      required:
        - id
        - nome
        - assunto
        - preheader
        - assunto_lembrete
        - remetente_nome
        - remetente_email
        - reply_to
        - valor_credito
        - validade_credito
        - teto_hora
        - teto_dia
        - status
        - agendada_para
        - lembrete_horas
        - corpo_lembrete
        - cor_botao_snapshot
        - incluir_desengajados
        - teste_enviado
        - teste_enviado_em
        - corpo
        - criado_em
        - criado_por_nome
        - criado_por_email
        - agendado_por_nome
        - agendado_por_email
        - agendado_em
        - pausado_por_nome
        - pausado_por_email
    CreateCampaignInput:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
        assunto:
          type: string
          minLength: 1
        preheader:
          type: ["string", "null"]
          maxLength: 100
