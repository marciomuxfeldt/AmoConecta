        path:
          type: string
        signed_url:
          type: string
          format: uri
        expires_in:
          type: integer
      required:
        - bucket
        - path
        - signed_url
        - expires_in
    ValidateImportInput:
      type: object
      properties:
        storage_path:
          type: string
          minLength: 1
