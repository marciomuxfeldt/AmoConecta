        amostras_erros:
          type: array
          items:
            $ref: "#/components/schemas/ImportValidationError"
      required:
        - storage_path
        - total_linhas
        - validos
        - invalidos
        - novos
        - atualizados
        - duplicados_no_arquivo
        - duplicados_email
        - duplicados_telefone
        - suprimidos
        - total_na_lista
        - suprimidos_no_envio
        - receberao_de_fato
        - emails_invalidos
        - datas_invalidas
        - nomes_ausentes
        - telefones_invalidos
        - destinatarios_salvos
        - recencia
        - amostras_erros
